name: Build_x86_25.12.512.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set +e
        docker rmi `docker images -q`
        echo "Deleting files, please wait ..."
        sudo rm -rf \
          /usr/share/dotnet \
          /etc/mysql \
          /etc/php
        sudo -E apt-get -y purge \
          azure-cli \
          ghc* \
          zulu* \
          hhvm \
          llvm* \
          firefox \
          google* \
          dotnet* \
          powershell \
          openjdk* \
          mysql* \
          php*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq full-upgrade
        sudo -E apt-get -y -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfstools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone source code
      env:
        REPO_URL: https://github.com/immortalwrt/immortalwrt
        REPO_BRANCH: openwrt-25.12
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Copy custom feed
      working-directory: ./openwrt
      run: |
        cp ../feeds.conf.custom feeds.conf
        if [ -d ../feeds ]; then
          cp -r ../feeds feeds/
          echo "Custom feeds copied successfully"
          ls -la feeds/
        else
          echo "ERROR: ../feeds directory not found in repo!"
          exit 1
        fi

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate base config (ONLY defconfig run)
      working-directory: ./openwrt
      run: |
        make defconfig

    - name: Enable target profile and all packages by patching .config directly
      working-directory: ./openwrt
      run: |
        # Helper: set a config value to y (enable), adding if missing, replacing if present
        set_config() {
          local key="$1"
          if grep -q "^${key}=" .config; then
            sed -i "s/^${key}=.*/${key}=y/" .config
          else
            echo "${key}=y" >> .config
          fi
        }

        # Helper: set a config value to a specific string (e.g., numbers)
        set_config_val() {
          local key="$1"
          local val="$2"
          if grep -q "^${key}=" .config; then
            sed -i "s/^${key}=.*/${key}=${val}/" .config
          else
            echo "${key}=${val}" >> .config
          fi
        }

        # --- Target profile (x86_64 generic EFI) ---
        set_config CONFIG_TARGET_x86
        set_config CONFIG_TARGET_x86_64
        set_config CONFIG_TARGET_x86_64_DEVICE_generic
        set_config_val CONFIG_TARGET_ROOTFS_PARTSIZE 650
        set_config CONFIG_TARGET_ROOTFS_SQUASHFS
        set_config_val CONFIG_TARGET_SQUASHFS_BLOCK_SIZE 256
        set_config CONFIG_GRUB_EFI_IMAGES
        set_config CONFIG_TARGET_IMAGES_GZIP
        set_config CONFIG_USE_APK

        # --- Core LuCI ---
        set_config CONFIG_PACKAGE_luci
        set_config CONFIG_PACKAGE_luci-base
        set_config CONFIG_PACKAGE_luci-mod-admin-full
        set_config CONFIG_PACKAGE_luci-mod-network
        set_config CONFIG_PACKAGE_luci-mod-system
        set_config CONFIG_PACKAGE_luci-mod-status
        set_config CONFIG_PACKAGE_luci-theme-openwrt-2020
        set_config CONFIG_PACKAGE_luci-app-opkg
        set_config CONFIG_PACKAGE_luci-app-firewall

        # --- Open-Box dependencies ---
        set_config CONFIG_PACKAGE_kmod-tun
        set_config CONFIG_PACKAGE_kmod-nft-queue
        set_config CONFIG_PACKAGE_kmod-nft-nat
        set_config CONFIG_PACKAGE_kmod-veth
        set_config CONFIG_PACKAGE_ip-full
        set_config CONFIG_PACKAGE_ca-bundle
        set_config CONFIG_PACKAGE_libcap
        set_config CONFIG_PACKAGE_libcap-bin

        # --- Open-Box main package ---
        set_config CONFIG_PACKAGE_luci-app-openbox

        echo "=== Patched .config entries ==="
        grep -E "^CONFIG_(TARGET_|PACKAGE_)" .config | sort

    - name: Verify luci-app-openbox config (must be y)
      working-directory: ./openwrt
      run: |
        echo "=== Check luci-app-openbox config ==="
        grep -E "^CONFIG_PACKAGE_luci-app-openbox=" .config || { echo "NOT FOUND in .config"; exit 1; }
        echo "=== Check dependencies ==="
        grep -E "^CONFIG_PACKAGE_(kmod-nft-queue|kmod-veth|ip-full|libcap|libcap-bin)=" .config
        echo "=== Target config ==="
        grep -E "^CONFIG_TARGET_x86" .config

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)
        echo "=== Checking for Open-Box tarball ==="
        ls -la dl/ | grep -i openbox || echo "No openbox tar.gz found in dl/"
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware (with VERBOSE)
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s 2>&1 | tee build.log
        echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}"
        grep -i "error\|failed\|impossible" build.log | tail -20

    - name: Check build artifacts size
      working-directory: ./openwrt
      run: |
        echo "=== Artifacts in bin/ ==="
        ls -la bin/targets/x86/64/
        IMAGES=$(ls bin/targets/x86/64/immortalwrt-x86-*-*.img.gz 2>/dev/null)
        for img in $IMAGES; do
          SIZE=$(stat -c%s "$img" 2>/dev/null || echo 0)
          echo "$img : $SIZE bytes ($((SIZE/1024/1024)) MB)"
        done

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: immortalwrt-x86-25.12.512${{ env.FILE_DATE }}
        path: openwrt/bin/targets/x86/64/immortalwrt-x86-64-generic-squashfs-combined-efi.img.gz
