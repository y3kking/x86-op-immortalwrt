name: Build_x86_25.12.1

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set +e
        docker rmi `docker images -q`
        echo "Deleting files, please wait ..."
        sudo rm -rf \
          /usr/share/dotnet \
          /etc/mysql \
          /etc/php
        sudo -E apt-get -y purge \
          azure-cli \
          ghc* \
          zulu* \
          hhvm \
          llvm* \
          firefox \
          google* \
          dotnet* \
          powershell \
          openjdk* \
          mysql* \
          php*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq full-upgrade
        sudo -E apt-get -y -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone source code
      env: 
        REPO_URL: https://github.com/immortalwrt/immortalwrt
        REPO_BRANCH: openwrt-25.12
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
    ##  printf "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main\nsrc-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main\n" | cat - feeds.conf.default > feeds.conf.default.new && mv feeds.conf.default.new feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization - Build_x86
      env:
        CONFIG_FILE: '.config25.12.1'
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        cd openwrt && make defconfig
        
    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j$(nproc) V=s
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV


    #####################################################################
    # 🚀 在固件 rootfs 中集成 Open-Box（已完整适配你的 ImmortalWrt x86）
    #####################################################################

    - name: Integrate Open-Box into firmware
      run: |
        echo ">>> Detecting rootfs directory"
        ROOTFS_DIR="openwrt/build_dir/target-x86_64_musl/root-x86"
        echo "ROOTFS_DIR = $ROOTFS_DIR"

        echo ">>> Creating Open-Box directory"
        mkdir -p $ROOTFS_DIR/opt/open-box

        echo ">>> Downloading Open-Box release (x64)"
        wget -O /tmp/open-box.tar.gz https://github.com/liandu2024/Open-Box/releases/latest/download/open-box-linux-x64.tar.gz

        echo ">>> Extracting Open-Box"
        tar -xzvf /tmp/open-box.tar.gz -C $ROOTFS_DIR/opt/open-box/

        echo ">>> Adding init.d service"
        mkdir -p $ROOTFS_DIR/etc/init.d

        cat << 'EOF' > $ROOTFS_DIR/etc/init.d/open-box
#!/bin/sh /etc/rc.common
START=99
STOP=10

start() {
    echo "Starting Open-Box..."
    /opt/open-box/open-box start
}

stop() {
    echo "Stopping Open-Box..."
    /opt/open-box/open-box stop
}
EOF

        chmod +x $ROOTFS_DIR/etc/init.d/open-box

        echo ">>> Open-Box integration completed"


    - name : Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: immortalwrt-x86-25.12.1${{ env.FILE_DATE }}
        path: openwrt/bin/targets/x86/64/immortalwrt-x86-64-generic-squashfs-combined-efi.img.gz
